name: deploy

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  staging:
    if: (github.event_name == 'release' && github.event.release.prerelease) || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        env:
          CHALLENGE_SECRET: ${{ secrets.CHALLENGE_SECRET }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.129.0"
          environment: staging
          secrets: |
            CHALLENGE_SECRET
            JEV_API_KEY
          command: >-
            deploy --env staging
            --var APPLE_TEAM_ID:${{ vars.APPLE_TEAM_ID }}
            --var APP_BUNDLE_ID:${{ vars.APP_BUNDLE_ID }}
            --var APP_ATTEST_ENVIRONMENT:${{ vars.APP_ATTEST_ENVIRONMENT }}
            --var WRITE_DAILY_LIMIT:${{ vars.WRITE_DAILY_LIMIT }}
            --var DECIDE_DAILY_LIMIT:${{ vars.DECIDE_DAILY_LIMIT }}

  production:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        env:
          CHALLENGE_SECRET: ${{ secrets.CHALLENGE_SECRET }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.129.0"
          environment: production
          secrets: |
            CHALLENGE_SECRET
            JEV_API_KEY
          command: >-
            deploy --env production
            --var APPLE_TEAM_ID:${{ vars.APPLE_TEAM_ID }}
            --var APP_BUNDLE_ID:${{ vars.APP_BUNDLE_ID }}
            --var APP_ATTEST_ENVIRONMENT:${{ vars.APP_ATTEST_ENVIRONMENT }}
            --var WRITE_DAILY_LIMIT:${{ vars.WRITE_DAILY_LIMIT }}
            --var DECIDE_DAILY_LIMIT:${{ vars.DECIDE_DAILY_LIMIT }}
